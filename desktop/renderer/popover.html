<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'" />
    <title>Aftertrace</title>
    <link rel="stylesheet" href="./popover.css" />
  </head>
  <body>
    <div class="pop">
      <header class="fresh" id="fresh" data-kind="loading">Starting…</header>
      <div class="body">
        <section class="block" id="sessions">
          <div class="empty" id="idle">Idle</div>
        </section>
      </div>
      <section class="block spend" id="spend-row" hidden>
        <div class="lbl">Today</div>
        <div class="num" id="spend"></div>
      </section>
      <button type="button" class="finding" id="finding" hidden></button>
      <footer class="foot">
        <button type="button" class="link" id="open">Open Aftertrace</button>
        <button type="button" class="link dim" id="settings">Settings</button>
        <label class="login"><input type="checkbox" id="login" /> Start at login</label>
        <button type="button" class="link" id="updates">Check for updates</button>
        <button type="button" class="link ready" id="restart" hidden>Restart to update</button>
        <button type="button" class="link dim" id="quit">Quit</button>
      </footer>
    </div>
    <script src="./popoverView.js"></script>
    <script src="./popover.js"></script>
  </body>
</html>
