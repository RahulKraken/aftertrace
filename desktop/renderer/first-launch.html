<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'" />
    <title>Aftertrace</title>
    <link rel="stylesheet" href="./first-launch.css" />
  </head>
  <body>
    <main>
      <svg class="mark" width="36" height="36" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path class="mark-plate" d="M12.360 3.000 H19.640 c3.276 0.000 4.914 0.000 6.166 0.638 a5.850 5.850 0 0 1 2.557 2.557 c0.638 1.251 0.638 2.890 0.638 6.166 V19.640 c0.000 3.276 0.000 4.914 -0.638 6.166 a5.850 5.850 0 0 1 -2.557 2.557 c-1.251 0.638 -2.890 0.638 -6.166 0.638 H12.360 c-3.276 0.000 -4.914 0.000 -6.166 -0.638 a5.850 5.850 0 0 1 -2.557 -2.557 c-0.638 -1.251 -0.638 -2.890 -0.638 -6.166 V12.360 c0.000 -3.276 0.000 -4.914 0.638 -6.166 a5.850 5.850 0 0 1 2.557 -2.557 c1.251 -0.638 2.890 -0.638 6.166 -0.638 Z"/>
        <path class="mark-hair" d="M12.060 3.500 H19.940 c2.996 0.000 4.494 0.000 5.639 0.583 a5.350 5.350 0 0 1 2.338 2.338 c0.583 1.144 0.583 2.643 0.583 5.639 V19.940 c0.000 2.996 0.000 4.494 -0.583 5.639 a5.350 5.350 0 0 1 -2.338 2.338 c-1.144 0.583 -2.643 0.583 -5.639 0.583 H12.060 c-2.996 0.000 -4.494 0.000 -5.639 -0.583 a5.350 5.350 0 0 1 -2.338 -2.338 c-0.583 -1.144 -0.583 -2.643 -0.583 -5.639 V12.060 c0.000 -2.996 0.000 -4.494 0.583 -5.639 a5.350 5.350 0 0 1 2.338 -2.338 c1.144 -0.583 2.643 -0.583 5.639 -0.583 Z"/>
        <path class="mark-trace" d="M6.50 16.00 L8.50 8.00 L11.50 23.00 L14.00 12.50 L16.50 16.00 L23.50 16.00"/>
        <circle class="mark-dot" cx="25" cy="16" r="2.7"/>
      </svg>
      <h1>Aftertrace</h1>
      <p class="lede">See where your AI work goes — time, cost, and the one change worth making next.</p>
      <p class="body">
        Everything stays on this machine. If you already use Claude Code, last month’s sessions are waiting.
      </p>
      <label class="login">
        <input id="login" type="checkbox" />
        <span>
          <strong>Open Aftertrace at login</strong>
          <small>Starts in the <span data-tray>menu bar</span>. Off unless you choose it.</small>
        </span>
      </label>
      <button id="open" type="button">Open Aftertrace</button>
      <p class="foot">Closing the window keeps Aftertrace in the <span data-tray>menu bar</span>.</p>
    </main>
    <script src="./first-launch.js"></script>
  </body>
</html>
