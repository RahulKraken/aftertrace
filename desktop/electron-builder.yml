appId: com.rahulkraken.aftertrace
productName: Aftertrace
copyright: Copyright 2026 Aftertrace contributors. Apache-2.0.

directories:
  output: dist
  buildResources: resources

files:
  - src/**/*
  - renderer/**/*
  - resources/icons/**/*
  - package.json
  - "!resources/engine/**"
  - "!dist/**"
  - "!test/**"
  - "!scripts/**"

extraResources:
  - from: resources/engine
    to: engine
    filter:
      - aftertrace
      - aftertrace.exe
  - from: resources/icons
    to: icons

extraMetadata:
  name: aftertrace-desktop

asar: true
asarUnpack:
  - resources/icons/**
compression: normal
removePackageScripts: true
removePackageKeywords: true

beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs
afterSign: scripts/after-sign.cjs

publish:
  provider: github
  owner: RahulKraken
  repo: aftertrace
  releaseType: release

# Stable names so the site and electron-updater can use
# https://github.com/RahulKraken/aftertrace/releases/latest/download/Aftertrace-mac.dmg
# Versioned copies (Aftertrace-0.5.0-mac.dmg) are added after pack.
artifactName: Aftertrace-${os}.${ext}
generateUpdatesFilesForAllChannels: true

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  binaries:
    - Contents/Resources/engine/aftertrace
  # Notarize when Apple credentials are present. CI passes
  # -c.mac.notarize=false when they are not, so unsigned builds still succeed.
  # Do not set notarize: true here — that would fail those builds.
  # No Mac App Store target.
  target:
    - dmg
    - zip
  artifactName: Aftertrace-${os}.${ext}
  extendInfo:
    LSUIElement: true
    NSHighResolutionCapable: true
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
      NSAllowsArbitraryLoads: false

dmg:
  title: Aftertrace
  artifactName: Aftertrace-${os}.${ext}

win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: Aftertrace-${os}.${ext}

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Aftertrace
  uninstallDisplayName: Aftertrace
  createDesktopShortcut: false
  createStartMenuShortcut: true
  artifactName: Aftertrace-${os}.${ext}

linux:
  executableName: Aftertrace
  maintainer: Aftertrace contributors <aftertrace@users.noreply.github.com>
  # Sized PNGs (16–512, 512 is the main) plus scalable SVG.
  icon: resources/linux-icons
  category: Utility
  synopsis: Time, cost and usage for your AI work
  description: Aftertrace shows where your AI work goes — time, cost, and the one change worth making next. Everything stays on this machine.
  desktop:
    entry:
      Name: Aftertrace
      Comment: Time, cost and usage for your AI work
      Categories: Utility;
      StartupNotify: "false"
  target:
    - AppImage
    - deb
  artifactName: Aftertrace-${os}.${ext}

extraFiles:
  - from: ../LICENSE
    to: LICENSE
