appId: com.rahulkraken.aftertrace
productName: Aftertrace
copyright: Copyright 2026 Aftertrace contributors. Apache-2.0.

directories:
  output: dist
  buildResources: resources

files:
  - src/**/*
  - renderer/**/*
  - resources/icons/**/*
  - package.json
  - "!resources/engine/**"
  - "!resources/engine-arch/**"
  - "!dist/**"
  - "!test/**"
  - "!scripts/**"

extraResources:
  - from: resources/engine
    to: engine
    filter:
      - aftertrace
      - aftertrace.exe
  - from: resources/icons
    to: icons
  # extraFiles would land at Aftertrace.app/Contents/LICENSE on Mac, which
  # codesign treats as nested code ("code object is not signed at all").
  # Resources/ is the valid place; Windows/Linux get resources/LICENSE.
  - from: ../LICENSE
    to: LICENSE

extraMetadata:
  name: aftertrace-desktop

asar: true
asarUnpack:
  - resources/icons/**
compression: normal
removePackageScripts: true
removePackageKeywords: true

beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs
afterSign: scripts/after-sign.cjs

publish:
  provider: github
  owner: RahulKraken
  repo: aftertrace
  releaseType: release

# Win/Linux keep Aftertrace-${os}.${ext}. Mac uses Aftertrace-${os}-${arch}.${ext}
# (Aftertrace-mac-arm64.dmg). Aftertrace-mac.dmg is copied from the arm64 DMG
# after pack so the existing latest/download link still works. CI packs
# Apple silicon only.
artifactName: Aftertrace-${os}.${ext}
generateUpdatesFilesForAllChannels: true

afterAllArtifactBuild: scripts/after-all-artifact-build.cjs

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  binaries:
    - Contents/Resources/engine/aftertrace
  # CI always passes -c.mac.notarize=false. Signing still happens via CSC_*.
  # afterAllArtifactBuild notarizes the arm64 DMG. Do not set notarize: true
  # here: unsigned local builds would fail, and electron-builder's sequential
  # app --wait blew the job budget. Consumer Mac is Apple silicon, not
  # universal / Intel.
  target:
    - dmg
    - zip
  artifactName: Aftertrace-${os}-${arch}.${ext}
  extendInfo:
    LSUIElement: true
    NSHighResolutionCapable: true
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
      NSAllowsArbitraryLoads: false

dmg:
  title: Aftertrace
  artifactName: Aftertrace-${os}-${arch}.${ext}

win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: Aftertrace-${os}.${ext}

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Aftertrace
  uninstallDisplayName: Aftertrace
  createDesktopShortcut: false
  createStartMenuShortcut: true
  artifactName: Aftertrace-${os}.${ext}

linux:
  executableName: Aftertrace
  maintainer: Aftertrace contributors <aftertrace@users.noreply.github.com>
  # Sized PNGs (16–512, 512 is the main) plus scalable SVG.
  icon: resources/linux-icons
  category: Utility
  synopsis: Time, cost and usage for your AI work
  description: Aftertrace shows where your AI work goes — time, cost, and the one change worth making next. Everything stays on this machine.
  desktop:
    entry:
      Name: Aftertrace
      Comment: Time, cost and usage for your AI work
      Categories: Utility;
      StartupNotify: "false"
  target:
    - AppImage
    - deb
  artifactName: Aftertrace-${os}.${ext}
