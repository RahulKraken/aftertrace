name: Desktop

# Unsigned (or signed, once Apple/Windows secrets exist) packages for Mac,
# Windows and Linux. PR artifacts are how to try the app until a tagged
# desktop release exists. Existing Go/UI CI is unchanged.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CSC_FOR_PULL_REQUEST: "true"
  # electron-builder would otherwise try to publish; PRs must not create releases.
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
      - name: Skip signing when the certificate is absent
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Signing skipped: CSC_LINK is not set."
          else
            echo "Signing enabled."
          fi
      - name: Build embedded UI
        working-directory: web
        run: npm ci && npm run build:embed
      - name: Desktop unit tests
        working-directory: desktop
        run: npm ci && npm test
      - name: Build Go engine
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          mkdir -p desktop/resources/engine
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o desktop/resources/engine/aftertrace ./cmd/aftertrace
          chmod +x desktop/resources/engine/aftertrace
          file desktop/resources/engine/aftertrace
      - name: Package
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Missing secrets become empty strings; electron-builder then treats
          # CSC_LINK="" as a cert path (the project directory) and fails.
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK
          [ -n "${CSC_KEY_PASSWORD:-}" ] || unset CSC_KEY_PASSWORD
          npx electron-builder --linux --x64 --publish never
      - name: Idle memory
        continue-on-error: true
        working-directory: desktop
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          bin=""
          for cand in dist/linux-unpacked/Aftertrace dist/linux-unpacked/aftertrace dist/linux-unpacked/aftertrace-desktop; do
            if [ -x "$cand" ]; then bin=$cand; break; fi
          done
          echo "binary=$bin"
          test -n "$bin"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' "$bin" --hidden --no-sandbox &
          pid=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7311/api/status >/dev/null; then break; fi
            sleep 1
          done
          sleep 8
          echo "----- process tree -----"
          ps -o pid,rss,comm --forest -g "$(ps -o sid= -p "$pid" | tr -d ' ')" || ps -o pid,rss,comm -p "$pid"
          echo "----- rss -----"
          python3 - <<PY
          import os, pathlib
          pid = ${pid}
          def rss(p):
              try:
                  for line in open(f"/proc/{p}/status"):
                      if line.startswith("VmRSS:"):
                          return int(line.split()[1])
              except FileNotFoundError:
                  return 0
              return 0
          def children(p):
              out = []
              try:
                  for name in os.listdir("/proc"):
                      if not name.isdigit():
                          continue
                      try:
                          stat = open(f"/proc/{name}/stat").read().split()
                          if int(stat[3]) == p or int(stat[4]) == p:
                              out.append(int(name))
                      except (FileNotFoundError, IndexError, ValueError):
                          pass
              except FileNotFoundError:
                  pass
              return out
          seen = set()
          stack = [pid]
          total = 0
          rows = []
          while stack:
              p = stack.pop()
              if p in seen:
                  continue
              seen.add(p)
              r = rss(p)
              total += r
              comm = pathlib.Path(f"/proc/{p}/comm").read_text().strip() if pathlib.Path(f"/proc/{p}/comm").exists() else "?"
              rows.append((r, p, comm))
              stack.extend(children(p))
              try:
                  for line in open(f"/proc/{p}/task/{p}/children").read().split():
                      stack.append(int(line))
              except FileNotFoundError:
                  pass
          rows.sort(reverse=True)
          for r, p, comm in rows:
              print(f"{r:8d} kB  pid={p}  {comm}")
          print(f"TOTAL   {total} kB ({total/1024:.1f} MiB)")
          pathlib.Path("dist/idle-memory.txt").write_text(
              f"linux unpackaged idle RSS (tray + engine): {total} kB ({total/1024:.1f} MiB)\n"
          )
          PY
          kill "$pid" || true
          wait || true
      - uses: actions/upload-artifact@v7
        with:
          name: aftertrace-desktop-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/idle-memory.txt
          if-no-files-found: error
          retention-days: 14

  mac:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
      - name: Skip signing when the certificate is absent
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Signing skipped: no Apple certificate secret."
          else
            echo "Signing enabled."
          fi
      - name: Build embedded UI
        working-directory: web
        run: npm ci && npm run build:embed
      - name: Desktop unit tests
        working-directory: desktop
        run: npm ci && npm test
      - name: Build universal Go engine
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          mkdir -p desktop/resources/engine
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o /tmp/aftertrace-arm64 ./cmd/aftertrace
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o /tmp/aftertrace-amd64 ./cmd/aftertrace
          lipo -create -output desktop/resources/engine/aftertrace /tmp/aftertrace-arm64 /tmp/aftertrace-amd64
          chmod +x desktop/resources/engine/aftertrace
          file desktop/resources/engine/aftertrace
          lipo -info desktop/resources/engine/aftertrace
      - name: Package
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Missing secrets become empty strings; electron-builder then treats
          # CSC_LINK="" as a cert path (the project directory) and fails.
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK
          [ -n "${CSC_KEY_PASSWORD:-}" ] || unset CSC_KEY_PASSWORD
          [ -n "${APPLE_ID:-}" ] || unset APPLE_ID
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || unset APPLE_APP_SPECIFIC_PASSWORD
          [ -n "${APPLE_TEAM_ID:-}" ] || unset APPLE_TEAM_ID
          [ -n "${APPLE_API_KEY:-}" ] || unset APPLE_API_KEY
          [ -n "${APPLE_API_KEY_ID:-}" ] || unset APPLE_API_KEY_ID
          [ -n "${APPLE_API_ISSUER:-}" ] || unset APPLE_API_ISSUER
          npx electron-builder --mac --universal --publish never
      - name: List artifacts
        run: ls -lah desktop/dist && (codesign -dv --verbose=4 desktop/dist/mac-universal/Aftertrace.app || true)
      - uses: actions/upload-artifact@v7
        with:
          name: aftertrace-desktop-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
      - name: Skip signing when the certificate is absent
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Signing skipped: CSC_LINK is not set."
          else
            echo "Signing enabled."
          fi
      - name: Install MinGW (CGO / DuckDB)
        run: choco install mingw -y --no-progress
      - name: Build embedded UI
        working-directory: web
        shell: bash
        run: npm ci && npm run build:embed
      - name: Desktop unit tests
        working-directory: desktop
        shell: bash
        run: npm ci && npm test
      - name: Build Go engine
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          mkdir -p desktop/resources/engine
          export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/tools/mingw64/bin:$PATH"
          gcc --version
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o desktop/resources/engine/aftertrace.exe ./cmd/aftertrace
          file desktop/resources/engine/aftertrace.exe || ls -lah desktop/resources/engine
      - name: Package
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Missing secrets become empty strings; electron-builder then treats
          # CSC_LINK="" as a cert path (the project directory) and fails.
          [ -n "${CSC_LINK:-}" ] || unset CSC_LINK
          [ -n "${CSC_KEY_PASSWORD:-}" ] || unset CSC_KEY_PASSWORD
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: aftertrace-desktop-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
