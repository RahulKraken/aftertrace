name: Desktop

# Unsigned (or signed, once Apple/Windows secrets exist) packages for Mac,
# Windows and Linux. On a PR this is the dry-run: artifacts named the same
# way a GitHub Release will attach them (Aftertrace-mac-arm64.dmg,
# Aftertrace-mac.dmg alias, latest-mac.yml, …) without publishing. Consumer
# Mac is Apple silicon; Intel is not packed or advertised. The Release
# workflow calls this file on a v* tag.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Engine version stamped into the sidecar (e.g. v0.5.0). Empty uses desktop/package.json.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CSC_FOR_PULL_REQUEST: "true"
  # electron-builder would otherwise try to publish; PRs must not create releases.
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
      - name: Build embedded UI
        working-directory: web
        run: npm ci && npm run build:embed
      - name: Desktop unit tests
        working-directory: desktop
        env:
          # Same as a tagged Release mac job. PRs used to omit this, so
          # v0.5.2's verify-release-assets leak stayed green on #44.
          REQUIRE_MAC_NOTARIZE: "true"
        run: npm ci && npm test
      - name: Build Go engine
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION=$(node -p "require('./desktop/package.json').version"); fi
          mkdir -p desktop/resources/engine
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o desktop/resources/engine/aftertrace ./cmd/aftertrace
          chmod +x desktop/resources/engine/aftertrace
          file desktop/resources/engine/aftertrace
      - name: Package
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: sh scripts/ci-pack.sh linux
      - name: Release identity
        run: node desktop/scripts/release-identity.cjs desktop/dist
      - name: Idle memory
        continue-on-error: true
        working-directory: desktop
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          bin=""
          for cand in dist/linux-unpacked/Aftertrace dist/linux-unpacked/aftertrace dist/linux-unpacked/aftertrace-desktop; do
            if [ -x "$cand" ]; then bin=$cand; break; fi
          done
          echo "binary=$bin"
          test -n "$bin"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' "$bin" --hidden --no-sandbox &
          pid=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7311/api/status >/dev/null; then break; fi
            sleep 1
          done
          sleep 8
          echo "----- process tree -----"
          ps -o pid,rss,comm --forest -g "$(ps -o sid= -p "$pid" | tr -d ' ')" || ps -o pid,rss,comm -p "$pid"
          echo "----- rss -----"
          python3 - <<PY
          import os, pathlib
          pid = ${pid}
          def rss(p):
              try:
                  for line in open(f"/proc/{p}/status"):
                      if line.startswith("VmRSS:"):
                          return int(line.split()[1])
              except FileNotFoundError:
                  return 0
              return 0
          def children(p):
              out = []
              try:
                  for name in os.listdir("/proc"):
                      if not name.isdigit():
                          continue
                      try:
                          stat = open(f"/proc/{name}/stat").read().split()
                          if int(stat[3]) == p or int(stat[4]) == p:
                              out.append(int(name))
                      except (FileNotFoundError, IndexError, ValueError):
                          pass
              except FileNotFoundError:
                  pass
              return out
          seen = set()
          stack = [pid]
          total = 0
          rows = []
          while stack:
              p = stack.pop()
              if p in seen:
                  continue
              seen.add(p)
              r = rss(p)
              total += r
              comm = pathlib.Path(f"/proc/{p}/comm").read_text().strip() if pathlib.Path(f"/proc/{p}/comm").exists() else "?"
              rows.append((r, p, comm))
              stack.extend(children(p))
              try:
                  for line in open(f"/proc/{p}/task/{p}/children").read().split():
                      stack.append(int(line))
              except FileNotFoundError:
                  pass
          rows.sort(reverse=True)
          for r, p, comm in rows:
              print(f"{r:8d} kB  pid={p}  {comm}")
          print(f"TOTAL   {total} kB ({total/1024:.1f} MiB)")
          pathlib.Path("dist/idle-memory.txt").write_text(
              f"linux unpackaged idle RSS (tray + engine): {total} kB ({total/1024:.1f} MiB)\n"
          )
          PY
          kill "$pid" || true
          wait || true
      - uses: actions/upload-artifact@v7
        with:
          name: aftertrace-desktop-linux
          path: |
            desktop/dist/Aftertrace-linux.AppImage
            desktop/dist/Aftertrace-linux.deb
            desktop/dist/Aftertrace-*-linux.AppImage
            desktop/dist/Aftertrace-*-linux.deb
            desktop/dist/latest-linux.yml
            desktop/dist/idle-memory.txt
          if-no-files-found: error
          retention-days: 14

  mac:
    name: macOS
    runs-on: macos-15
    # Pack+sign is minutes. One arm64 DMG notarytool wait (--timeout 5400)
    # is the long pole on PRs. Two parallel waits stayed In Progress for
    # 60m; sequential app notarize cancelled at 60m after codesign.
    timeout-minutes: 130
    env:
      CGO_ENABLED: "1"
      NOTARIZE_MAC_ARCHES: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
      - name: Build embedded UI
        working-directory: web
        run: npm ci && npm run build:embed
      - name: Desktop unit tests
        working-directory: desktop
        env:
          # Same as a tagged Release mac job. PRs used to omit this, so
          # v0.5.2's verify-release-assets leak stayed green on #44.
          REQUIRE_MAC_NOTARIZE: "true"
        run: npm ci && npm test
      - name: Build per-chip Go engines
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION=$(node -p "require('./desktop/package.json').version"); fi
          mkdir -p desktop/resources/engine-arch/darwin-arm64
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o desktop/resources/engine-arch/darwin-arm64/aftertrace ./cmd/aftertrace
          chmod +x desktop/resources/engine-arch/darwin-arm64/aftertrace
          file desktop/resources/engine-arch/darwin-arm64/aftertrace
          lipo -info desktop/resources/engine-arch/darwin-arm64/aftertrace
      - name: Package
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Fail closed on Release (workflow_call / v* tag) if Apple never
          # Accepts. Keep this off the job env: Desktop unit tests spawn
          # verify-release-assets.sh and would inherit it (v0.5.2 run
          # 42330980385 failed before pack).
          REQUIRE_MAC_NOTARIZE: ${{ github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v') }}
        run: sh scripts/ci-pack.sh mac
      - name: Release identity
        run: node desktop/scripts/release-identity.cjs desktop/dist
      - name: Verify per-chip packages
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # shellcheck disable=SC1091
          . scripts/ci-signing-env.sh
          sh scripts/ci-verify-mac.sh
      - name: Artifact feed vs shipped 0.5.0 identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh desktop/scripts/artifact-feed-smoke.sh desktop/dist
      - name: macos-15 session probe
        run: sh desktop/scripts/macos-session-probe.sh desktop/dist/macos-session-probe.txt
      - name: Pack CI-only signed 0.5.5 fixture
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: sh scripts/pack-ci-fixture.sh 0.5.5 dist-fixture
      - name: Signed upgrade smoke
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: sh desktop/scripts/signed-upgrade-smoke.sh desktop/dist desktop/dist-fixture
      - name: List artifacts
        if: always()
        run: |
          ls -lah desktop/dist || true
          for app in desktop/dist/mac-arm64/Aftertrace.app desktop/dist/mac-x64/Aftertrace.app desktop/dist/mac/Aftertrace.app; do
            [ -d "$app" ] || continue
            codesign -dv --verbose=4 "$app" || true
          done
          cat desktop/dist/mac-engine-report.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aftertrace-desktop-mac
          path: |
            desktop/dist/Aftertrace-mac.dmg
            desktop/dist/Aftertrace-mac.zip
            desktop/dist/Aftertrace-mac-arm64.dmg
            desktop/dist/Aftertrace-mac-x64.dmg
            desktop/dist/Aftertrace-mac-arm64.zip
            desktop/dist/Aftertrace-mac-x64.zip
            desktop/dist/Aftertrace-*-mac.dmg
            desktop/dist/Aftertrace-*-mac.zip
            desktop/dist/Aftertrace-*-mac-*.dmg
            desktop/dist/Aftertrace-*-mac-*.zip
            desktop/dist/Aftertrace-mac.zip.blockmap
            desktop/dist/Aftertrace-mac-*.zip.blockmap
            desktop/dist/Aftertrace-*-mac.zip.blockmap
            desktop/dist/Aftertrace-*-mac-*.zip.blockmap
            desktop/dist/latest-mac.yml
            desktop/dist/*notarized.json
            desktop/dist/mac-engine-report.txt
            desktop/dist/macos-session-probe.txt
            desktop/dist/signed-upgrade-smoke.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aftertrace-macos-session
          path: |
            desktop/dist/macos-session-probe.txt
            desktop/dist/signed-upgrade-smoke.txt
            desktop/dist/signed-upgrade-native.png
            desktop/dist/signed-upgrade-dock-open.png
            desktop/dist/signed-upgrade-dock-closed.png
            desktop/dist/signed-upgrade-dock-reopen.png
            desktop/dist/signed-upgrade-menu.png
            desktop/dist/signed-upgrade-menu-keyboard.png
            desktop/dist/signed-upgrade-menu-dark.png
            desktop/dist/signed-upgrade-menu-activity.png
            desktop/dist/signed-upgrade-menu-activity-dark.png
            desktop/dist/signed-upgrade-menu-reopen.png
            desktop/dist/signed-upgrade-session-open.png
            desktop/dist/signed-upgrade-glyph.png
            desktop/dist/session-screencapture.png
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('desktop/package-lock.json') }}
      - name: Install MinGW (CGO / DuckDB)
        run: |
          # GCC 16 libstdc++ dropped emutls once_call symbols. DuckDB's
          # prebuilt windows-amd64 archive still references them, so pin
          # MinGW to 14.2.0 (posix/seh/ucrt). Keep it off GITHUB_PATH so
          # desktop unit tests do not inherit the toolchain.
          choco install mingw --version=14.2.0 -y --no-progress --allow-downgrade
      - name: Build embedded UI
        working-directory: web
        shell: bash
        run: npm ci && npm run build:embed
      - name: Desktop unit tests
        working-directory: desktop
        shell: bash
        env:
          # Same as a tagged Release mac job. PRs used to omit this, so
          # v0.5.2's verify-release-assets leak stayed green on #44.
          REQUIRE_MAC_NOTARIZE: "true"
        run: npm ci && npm test
      - name: Build Go engine
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION=$(node -p "require('./desktop/package.json').version"); fi
          mkdir -p desktop/resources/engine
          export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/tools/mingw64/bin:$PATH"
          gcc --version
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o desktop/resources/engine/aftertrace.exe ./cmd/aftertrace
          file desktop/resources/engine/aftertrace.exe || ls -lah desktop/resources/engine
      - name: Package
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: sh scripts/ci-pack.sh win
      - name: Release identity
        shell: bash
        run: node desktop/scripts/release-identity.cjs desktop/dist
      - uses: actions/upload-artifact@v7
        with:
          name: aftertrace-desktop-windows
          path: |
            desktop/dist/Aftertrace-win.exe
            desktop/dist/Aftertrace-*-win.exe
            desktop/dist/Aftertrace-win.exe.blockmap
            desktop/dist/Aftertrace-*-win.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
