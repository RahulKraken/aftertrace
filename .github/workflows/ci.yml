name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "Harness profile (ci, nightly, full)"
        required: false
        default: "nightly"
      corpus:
        description: "Corpus size (e.g. 32MiB, 512MiB, 2GiB). Empty uses the profile default."
        required: false
        default: ""
      sessions:
        description: "Session count. Empty uses the profile default."
        required: false
        default: ""
      idle:
        description: "Idle window (Go duration). Empty uses the profile default."
        required: false
        default: ""
      crash_trials:
        description: "SIGKILL trials. Empty uses the profile default."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    if: github.event_name != 'workflow_dispatch'
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # DuckDB links through CGO. CGO_ENABLED=0 does not compile.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web)" || (gofmt -l cmd internal web && exit 1)
      - run: go vet ./...
      # Read handlers run concurrently with ingest; -race keeps them honest.
      - run: go test -race ./...
      # -race inflates RSS. Bound DuckDB without it: 256MB memory_limit, 2 threads.
      - name: DuckDB RSS bound
        if: matrix.os == 'ubuntu-latest'
        env:
          AFTERTRACE_RSS_TEST: "1"
        run: go test -count=1 -timeout 15m ./internal/store -run TestPeakRSSOnSeededDB -v
      - name: Realistic seed latency and RSS
        if: matrix.os == 'ubuntu-latest'
        env:
          AFTERTRACE_PERF: "1"
          AFTERTRACE_PERF_OUT: ${{ runner.temp }}/perf
        run: go test -count=1 -timeout 25m ./internal/perf -run TestBudgetsOnRealisticSeed -v
      - name: Upload perf profiles
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-perf-profiles
          path: ${{ runner.temp }}/perf
          if-no-files-found: ignore
          retention-days: 14
      # Builds against the committed stub web/dist/index.html (no Node).
      - run: go build -o aftertrace ./cmd/aftertrace
      # Install the login service for real (LaunchAgent on macOS, systemd
      # --user on Linux), check the server says it runs as one, remove it.
      - name: Service round trip
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo loginctl enable-linger "$USER"
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            for i in $(seq 1 20); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          fi
          ./aftertrace service install --db "$RUNNER_TEMP/svc.duckdb"
          ./aftertrace service status
          curl -sf http://127.0.0.1:7311/api/status | jq -e '.info.service == "launchd" or .info.service == "systemd"'
          ./aftertrace service uninstall
          if ./aftertrace service status; then exit 1; fi
          if curl -sf http://127.0.0.1:7311/api/status; then exit 1; fi
      - name: Service log
        if: failure()
        run: cat ~/.aftertrace/serve.log || true

  web:
    if: github.event_name != 'workflow_dispatch'
    name: Web UI + embedded binary
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      # Overwrites the tracked stub web/dist/index.html. That is expected on a
      # throwaway runner; nothing here commits it.
      - name: Build embedded UI
        working-directory: web
        run: npm run build:embed
      - name: Build binary with embedded UI
        run: go build -o aftertrace ./cmd/aftertrace
      - name: Check the UI bundle is embedded
        run: |
          bundle=$(basename "$(ls web/dist/assets/index-*.js | head -n1)")
          test -n "$bundle"
          grep -aqF "dist/assets/$bundle" aftertrace
          echo "embedded $bundle"
      # Smoke test the real binary on demo data: the mock e2e suite cannot
      # catch API, SQL or locking bugs.
      - name: Start aftertrace on demo data
        run: |
          ./aftertrace demo --db "$RUNNER_TEMP/demo.duckdb"
          ./aftertrace serve --db "$RUNNER_TEMP/demo.duckdb" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7311/api/status > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/serve.log"; exit 1
      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Smoke test against the real server
        working-directory: web
        run: npx playwright test -c playwright.live.config.ts
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/serve.log"

  shellcheck:
    if: github.event_name != 'workflow_dispatch'
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck -s sh install.sh
          shellcheck -s sh scripts/verify-release-assets.sh
          shellcheck -s sh desktop/scripts/ci-pack.sh
          shellcheck -s sh desktop/scripts/ci-signing-env.sh
          shellcheck -s sh desktop/scripts/ci-verify-mac.sh
          shellcheck -s sh desktop/scripts/artifact-feed-smoke.sh
          shellcheck -s sh desktop/scripts/pack-ci-fixture.sh
          shellcheck -s sh desktop/scripts/macos-session-probe.sh
          shellcheck -s sh desktop/scripts/signed-upgrade-smoke.sh
          shellcheck -s sh scripts/homebrew-cask.sh
          shellcheck -s sh web/scripts/gen-readme-demo.sh
      - name: Homebrew cask matches the generator
        run: |
          ver=$(awk -F'"' '/^  version / {print $2; exit}' packaging/homebrew/Casks/aftertrace.rb)
          sha=$(awk -F'"' '/^  sha256 / {print $2; exit}' packaging/homebrew/Casks/aftertrace.rb)
          test -n "$ver" && test -n "$sha"
          sh scripts/homebrew-cask.sh "$ver" "$sha" > "$RUNNER_TEMP/aftertrace.rb"
          diff -u packaging/homebrew/Casks/aftertrace.rb "$RUNNER_TEMP/aftertrace.rb"
          grep -q 'depends_on arch: :arm64' packaging/homebrew/Casks/aftertrace.rb
          grep -q 'strategy :github_latest' packaging/homebrew/Casks/aftertrace.rb
      - name: Site download tests
        working-directory: site
        run: npm test

  scale:
    name: Scale harness
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # PR go test is still 14m. Dispatch and a slow macos queue need headroom.
    timeout-minutes: 180
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Paths
        id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "$BASE"...HEAD | grep -Eq '^(internal/(store|history|otlp|api|harness)/|cmd/|desktop/|web/|\.github/workflows/(ci|nightly)\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Engine or harness paths changed; running the scale job."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No engine/harness paths; skipping the scale harness."
          fi
      - uses: actions/setup-go@v7
        if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Audit reproductions (report-only)
        if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.run == 'true'
        run: go test -count=1 -timeout 5m ./internal/store -run 'TestAudit|TestInjectedStoreFailure' -v
      - name: Scale + energy harness (report-only)
        if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.run == 'true'
        env:
          AFTERTRACE_HARNESS: "1"
          AFTERTRACE_HARNESS_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile || 'ci' }}
          AFTERTRACE_HARNESS_SIZE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.corpus || '' }}
          AFTERTRACE_HARNESS_SESSIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sessions || '' }}
          AFTERTRACE_HARNESS_IDLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.idle || '' }}
          AFTERTRACE_HARNESS_CRASH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.crash_trials || '' }}
          AFTERTRACE_HARNESS_OUT: ${{ runner.temp }}/harness
          AFTERTRACE_HARNESS_JSON: ${{ runner.temp }}/harness/budgets.json
        run: |
          mkdir -p "$AFTERTRACE_HARNESS_OUT"
          timeout=16m
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            timeout=3h
          fi
          go test -count=1 -timeout "$timeout" ./internal/harness -run TestScaleBudgets -v
          echo "----- budget summary -----"
          cat "$AFTERTRACE_HARNESS_OUT/budgets.md" || cat "$AFTERTRACE_HARNESS_JSON"
      - name: Upload budget report
        if: (github.event_name == 'workflow_dispatch' || steps.paths.outputs.run == 'true') && always()
        uses: actions/upload-artifact@v7
        with:
          name: scale-budget-report
          path: |
            ${{ runner.temp }}/harness/budgets.json
            ${{ runner.temp }}/harness/budgets.md
          if-no-files-found: ignore
          retention-days: 14

  install:
    if: github.event_name != 'workflow_dispatch'
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      AFTERTRACE_NO_OPEN: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Flags without a network
        run: |
          sh install.sh --help | grep -q -- --no-service
          sh install.sh --help | grep -q -- --no-open
          if sh install.sh --not-a-flag 2>/dev/null; then echo "unknown flag should fail"; exit 1; fi
      - name: Linux user systemd
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ]
      - name: install.sh
        run: |
          AFTERTRACE_BIN="$RUNNER_TEMP/aftertrace-bin"
          mkdir -p "$AFTERTRACE_BIN"
          echo "AFTERTRACE_BIN=$AFTERTRACE_BIN" >> "$GITHUB_ENV"
          AFTERTRACE_BIN="$AFTERTRACE_BIN" sh install.sh | tee "$RUNNER_TEMP/install-out.txt"
          echo "----- installer output -----"
          cat "$RUNNER_TEMP/install-out.txt"
      - name: Binary and server
        run: |
          test -x "$AFTERTRACE_BIN/aftertrace"
          "$AFTERTRACE_BIN/aftertrace" version
          curl -sf http://127.0.0.1:7311/api/status | grep -E '"service":"(launchd|systemd)"'
          grep -q "Add .* to your PATH" "$RUNNER_TEMP/install-out.txt"
          grep -q "Aftertrace is running at http://127.0.0.1:7311" "$RUNNER_TEMP/install-out.txt"
          test "$(wc -l < "$RUNNER_TEMP/install-out.txt")" -le 8
      - name: Re-run installer
        run: |
          sh install.sh | tee "$RUNNER_TEMP/install-out-2.txt"
          curl -sf http://127.0.0.1:7311/api/status | grep -E '"service":"(launchd|systemd)"'
          grep -q "Aftertrace is running at http://127.0.0.1:7311" "$RUNNER_TEMP/install-out-2.txt"
      - name: Service log
        if: failure()
        run: cat ~/.aftertrace/serve.log || true

  e2e:
    if: github.event_name != 'workflow_dispatch'
    name: Playwright e2e (mock UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
