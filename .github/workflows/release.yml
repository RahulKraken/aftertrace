name: Release

# Push a tag like v0.5.0 to build engine archives + desktop packages and
# publish a GitHub Release. Run it by hand (workflow_dispatch) for a dry-run:
# the same files are built and uploaded as workflow artifacts, nothing is
# published. Do not push tags from a PR; Rahul publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    name: Engine ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # DuckDB links through CGO, so each target builds on a matching
          # runner. Both macOS archives build on Apple silicon; clang targets
          # x86_64 with -arch.
          - { runner: macos-latest, goos: darwin, goarch: arm64, cc: clang }
          - { runner: macos-latest, goos: darwin, goarch: amd64, cc: "clang -arch x86_64" }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cc: gcc }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, cc: gcc }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the UI
        working-directory: web
        run: npm ci && npm run build:embed
      - name: Build the binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="dev-${GITHUB_SHA::7}" ;; esac
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o aftertrace ./cmd/aftertrace
          file aftertrace
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Check it runs
        if: matrix.goarch == 'arm64' && matrix.goos == 'darwin' || matrix.goarch == 'amd64' && matrix.goos == 'linux' || matrix.goarch == 'arm64' && matrix.goos == 'linux'
        run: ./aftertrace version && ./aftertrace demo --db "$RUNNER_TEMP/check.duckdb"
      - name: Archive
        run: |
          NAME="aftertrace_${VERSION}_${GOOS}_${GOARCH}"
          mkdir "$NAME"
          cp aftertrace LICENSE README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          echo "ARCHIVE=$NAME.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  desktop:
    name: Desktop
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  assemble:
    name: Assemble
    needs: [engine, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums for install.sh
        working-directory: dist
        run: sha256sum aftertrace_*.tar.gz > checksums.txt && cat checksums.txt
      - name: Verify release assets
        env:
          REQUIRE_MAC_NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: sh scripts/verify-release-assets.sh dist
      - name: List what a release would attach
        run: |
          echo "Engine (install.sh):"
          ls -lah dist/aftertrace_*.tar.gz dist/checksums.txt
          echo "Desktop:"
          ls -lah dist/Aftertrace-* dist/latest*.yml
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/aftertrace_*.tar.gz
            dist/checksums.txt
            dist/Aftertrace-mac.dmg
            dist/Aftertrace-mac.zip
            dist/Aftertrace-mac-arm64.dmg
            dist/Aftertrace-mac-x64.dmg
            dist/Aftertrace-mac-arm64.zip
            dist/Aftertrace-mac-x64.zip
            dist/Aftertrace-*-mac.dmg
            dist/Aftertrace-*-mac.zip
            dist/Aftertrace-*-mac-*.dmg
            dist/Aftertrace-*-mac-*.zip
            dist/Aftertrace-mac.zip.blockmap
            dist/Aftertrace-mac-*.zip.blockmap
            dist/*notarized.json
            dist/Aftertrace-win.exe
            dist/Aftertrace-*-win.exe
            dist/Aftertrace-win.exe.blockmap
            dist/Aftertrace-linux.AppImage
            dist/Aftertrace-linux.deb
            dist/Aftertrace-*-linux.AppImage
            dist/Aftertrace-*-linux.deb
            dist/latest-mac.yml
            dist/latest.yml
            dist/latest-linux.yml
          if-no-files-found: error
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " { if (found) exit; if (index($0, tag)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed: do not publish a consumer Mac download that Apple
          # has not Accepted. The site treats Aftertrace-mac-notarized.json
          # as "opens normally"; never attach DMGs without it.
          if [ ! -f dist/Aftertrace-mac-notarized.json ]; then
            echo "Refuse to publish $GITHUB_REF_NAME: Aftertrace-mac-notarized.json is missing (not Apple Accepted + stapled)." >&2
            ls -la dist >&2
            exit 1
          fi
          cd dist
          set -- aftertrace_*.tar.gz checksums.txt \
            Aftertrace-mac.dmg Aftertrace-mac.zip latest-mac.yml \
            Aftertrace-mac-arm64.dmg Aftertrace-mac-arm64.zip \
            Aftertrace-win.exe latest.yml \
            Aftertrace-linux.AppImage Aftertrace-linux.deb
          for f in Aftertrace-*-mac.dmg Aftertrace-*-mac.zip \
                   Aftertrace-*-mac-*.dmg Aftertrace-*-mac-*.zip \
                   Aftertrace-*-win.exe \
                   Aftertrace-*-linux.AppImage Aftertrace-*-linux.deb \
                   Aftertrace-mac.zip.blockmap Aftertrace-mac-*.zip.blockmap \
                   Aftertrace-win.exe.blockmap \
                   Aftertrace-*-mac.zip.blockmap Aftertrace-*-mac-*.zip.blockmap \
                   Aftertrace-*-win.exe.blockmap \
                   Aftertrace-mac-notarized.json \
                   latest-linux.yml; do
            [ -f "$f" ] || continue
            case "$f" in
              *x64*) continue ;;
            esac
            case " $* " in
              *" $f "*) ;;
              *) set -- "$@" "$f" ;;
            esac
          done
          echo "Attaching: $*"
          gh release create "$GITHUB_REF_NAME" "$@" --title "Aftertrace $GITHUB_REF_NAME" --notes-file ../notes.md
